services:
  moulaga:
    build: .
    image: moulaga:latest
    container_name: moulaga
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      # Destructif : retirez cette variable pour conserver les donnees entre les demarrages.
      MOULAGA_DEMO_MODE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
