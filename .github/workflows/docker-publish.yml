name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Decide whether this tag is the newest release
        id: latest
        run: |
          highest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "${highest}" ] && [ "${GITHUB_REF_NAME}" = "${highest}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${GITHUB_REF_NAME} highest=${highest:-<none>}"

      - name: Compute app version
        id: version
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) value="${GITHUB_REF_NAME}" ;;
            *) value="nightly-$(git rev-parse --short HEAD)" ;;
          esac
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "app version: ${value}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.latest.outputs.is_latest == 'true' }}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            MOULAGA_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        continue-on-error: true
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Fallback changelog
        id: changelog_fallback
        if: steps.changelog.outcome == 'failure' || steps.changelog.outputs.changes == ''
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "changes<<CHANGELOG_EOF"
            if [ -n "${previous}" ]; then
              git log --no-show-signature --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "_Première publication : pas de tag précédent._"
              echo ""
              git log --no-show-signature --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release compose file
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.ref_name }}
        run: |
          yq eval '.services.moulaga.image = strenv(IMAGE_REF) | del(.services.moulaga.build)' docker-compose.yml > docker-compose.release.yml

      - name: Write image reference file
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
          } > image-digest.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes || steps.changelog_fallback.outputs.changes }}
          files: |
            docker-compose.release.yml
            image-digest.txt
