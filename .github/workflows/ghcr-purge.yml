name: Purge GHCR package

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.repository }}
        run: |
          echo "Purge is intentionally minimal for a personal app; keep tags needed for image publication."
          echo "Package: ${PACKAGE}"
